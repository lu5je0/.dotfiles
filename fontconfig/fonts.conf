<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  字体渲染：次像素抗锯齿 + RGB 子像素排列 + 完全微调。

  为什么用 mode="assign"：发行版的 /etc/fonts/conf.d/10-hinting-slight.conf、
  11-lcdfilter-default.conf 都是 mode="append"（弱绑定、只追加到值列表末尾），
  本文件由 50-user.conf 引入，assign 是强绑定且整条列表替换，稳定压过它们。

  可调项：
    rgba       子像素排列顺序：rgb（常规横排）/ bgr / vrgb / vbgr；
               改 none 即关闭次像素渲染，退回灰度抗锯齿。
    lcdfilter  次像素滤波：lcddefault（平衡）/ lcdlight（更锐、彩边更少）/
               lcdlegacy / lcdnone。
    hintstyle  微调强度：hintnone / hintslight / hintmedium / hintfull。

  验证（hintstyle 3=full, rgba 1=rgb, lcdfilter 1=lcddefault）：
    fc-match -f 'hintstyle=%{hintstyle} rgba=%{rgba} lcdfilter=%{lcdfilter}\n' sans

  实测坑（Arch fontconfig 2.18.3）：本文件的 assign 确实生效（拿 dpi 验过，
  加一条 dpi=96 fc-match 就报 96），但把 rgba 改成 none、hintstyle 改成 hintnone，
  fc-match 的输出仍是 1 和 3 —— 这两项在字体匹配阶段被钉住了，只改这里没用。
  真要换子像素排列或微调强度，得同时改 GNOME 侧：
    gsettings set org.gnome.desktop.interface font-antialiasing 'rgba'  # 或 'grayscale'
    gsettings set org.gnome.desktop.interface font-hinting 'full'       # 或 'slight'
  GTK 应用读的是 gsettings（优先级更高），两边不一致就会「命令行看着对、界面上不对」。
  另外次像素渲染在分数缩放（本机 4K @1.67）下由合成器自行决定是否启用。
-->
<fontconfig>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
