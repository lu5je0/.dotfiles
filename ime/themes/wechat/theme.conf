[Metadata]
Name=WeChat
Name[zh_CN]=微信绿
Version=1
Author=lu5je0
Description=Matches the WeChat-style Rime skin used by Weasel (Windows) and Squirrel (macOS).
# 颜色由 ime/rime/{weasel,squirrel}.custom.yaml 换算而来：
# Rime 用 0xAABBGGRR（BGR 序），fcitx5 用 #RRGGBB，不能直接照抄数字。
# 例：squirrel 的 hilited_candidate_back_color 0x75B100 -> #00B175
ScaleWithDPI=True

[InputPanel]
# 候选词文字（weasel candidate_text_color 0x3c3c3c）
NormalColor=#3c3c3c
# 选中候选词文字（hilited_candidate_text_color 0xFFFFFF）
HighlightCandidateColor=#ffffff
# 预编辑区文字（weasel text_color 0x424242）
HighlightColor=#424242
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=10
Right=10
Top=7
Bottom=7

[InputPanel/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

# 圆角和边框都烘在 9-patch 背景图里：fcitx5 没有 BorderRadius，
# 而 BorderWidth/BorderColor 只在背景图缺失时才生效（配了 Image= 就走不到那个分支），
# 所以下面的 BorderWidth 只对 panel.png 丢失时的兜底样式有意义。
# panel.png 是 32x32、10px 圆角、1px #dadada 边框（该色值是从微信面板截图里量的），
# Margin=10 保住四角、中间拉伸。
# 要改边框/圆角：改 ime/themes/gen-panel.sh 里的参数后重跑该脚本。
[InputPanel/Background]
Image=panel.png
Color=#ffffff
BorderWidth=0

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Highlight]
Image=highlight.png
Color=#00b175

[InputPanel/Highlight/Margin]
Left=6
Right=6
Top=6
Bottom=6

[Menu]
NormalColor=#3c3c3c
HighlightCandidateColor=#ffffff

# 同 InputPanel/Background：边框在 panel.png 里，BorderWidth 仅为兜底
[Menu/Background]
Image=panel.png
Color=#ffffff
BorderWidth=0

[Menu/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/Highlight]
Image=highlight.png
Color=#00b175

[Menu/Highlight/Margin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/Separator]
Color=#e5e5e5

[Menu/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

