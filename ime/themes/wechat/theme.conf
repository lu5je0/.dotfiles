[Metadata]
Name=WeChat
Name[zh_CN]=微信绿
Version=1
Author=lu5je0
Description=Matches the WeChat-style Rime skin used by Squirrel (macOS).
# 颜色由 ime/rime/squirrel.custom.yaml 换算而来：
# Rime 用 0xAABBGGRR（BGR 序），fcitx5 用 #RRGGBB，不能直接照抄数字。
# 例：squirrel 的 hilited_candidate_back_color 0x75B100 -> #00B175
ScaleWithDPI=True

[InputPanel]
# 候选词文字（candidate_text_color 0x3c3c3c）
NormalColor=#3c3c3c
# 选中候选词文字（hilited_candidate_text_color 0xFFFFFF）
HighlightCandidateColor=#ffffff
# 预编辑区文字（squirrel text_color 0x424242）
HighlightColor=#424242
PageButtonAlignment=Last Candidate

# 留白按微信输入法截图的「相对字高比例」量出来的（见 ime/AGENTS.md「候选框皮肤」）。
# fcitx5 的几何关系（inputwindow.cpp）：
#   绿块 = 候选文字盒 ± Highlight/Margin      → 绿块内边距只由 Highlight/Margin 决定
#   候选间距 = TextMargin.Left+Right − Highlight/Margin
#   面板边 → 绿块 = ContentMargin + TextMargin − Highlight/Margin
# 四边都凑成 6：竖直 7+3−4，水平 4+6−4。绿块圆角按同心圆取 面板圆角 10 − 6 = 4，
# 这样绿块和面板的圆弧是平行的，不会一个方一个圆。
[InputPanel/TextMargin]
Left=6
Right=6
Top=3
Bottom=3

[InputPanel/ContentMargin]
Left=4
Right=4
Top=7
Bottom=7

# 圆角和边框都画在 9-patch 背景图里：fcitx5 没有 BorderRadius，
# 而 BorderWidth/BorderColor 只在背景图缺失时才生效（配了 Image= 就走不到那个分支），
# 所以下面的 BorderWidth 只对 panel.svg 丢失时的兜底样式有意义。
# 用 SVG 是为了让边框和圆角不被小数缩放摊虚，边框实心靠的是 panel.svg 里的双层矩形写法
# （见该文件注释）；fcitx5 链了 librsvg 才是矢量重绘，否则退化成位图（见 ime/AGENTS.md）。
# panel.svg 是 32x32、10px 圆角、3 物理像素 #dadada 边框（色值从微信面板截图里量的），
# Margin=10 保住四角、中间拉伸。
[InputPanel/Background]
Image=panel.svg
Color=#ffffff
BorderWidth=0

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Highlight]
Image=highlight.svg
Color=#00b175

# Margin 既是 9-patch 的拉伸边界（highlight.svg 的圆角必须 <= 它），
# 也是绿块相对文字的内边距 —— 想更圆就必然更胖，绕不开。
[InputPanel/Highlight/Margin]
Left=4
Right=4
Top=4
Bottom=4

[Menu]
NormalColor=#3c3c3c
HighlightCandidateColor=#ffffff

# 同 InputPanel/Background：边框在 panel.svg 里，BorderWidth 仅为兜底
[Menu/Background]
Image=panel.svg
Color=#ffffff
BorderWidth=0

[Menu/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/Highlight]
Image=highlight.svg
Color=#00b175

[Menu/Highlight/Margin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/Separator]
Color=#e5e5e5

[Menu/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

