<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  让 emoji 走 Noto Color Emoji, 别被黑白的 Noto Sans Symbols 2 截胡。

  现象: 在候选框/普通文本里打出 🛏(U+1F6CF) 等 emoji 时, 该字被渲染成
  一个又宽又扁的黑白字形, 把 fcitx5 候选框(乃至任意文本行)撑大;
  而 🛌 之类 emoji 正常。

  根因(全是 fontconfig 字体回退, 与输入法无关):
    - 候选框字体 Sans 里没有 emoji, 要回退到别的字体。
    - Noto Sans Symbols 2 和 Noto Color Emoji 有 267 个码点重叠(都能画 🛏),
      仅 Symbols 2 独有的还有 991 个(麻将 🀀 / 扑克 🃏 等, 不能动)。
    - fontconfig 取「sans-serif 回退链里第一个覆盖该码点的字体」:
      Symbols 2 排第 28, Color Emoji 排第 185(最后一名),
      所以 267 个重叠码点全被 Symbols 2 抢走 -> 黑白宽字形。
    - Color Emoji 之所以垫底: 它只声明 lang=und-zsye, 对 en 请求强失配被重罚;
      Symbols 2 lang 为空集不被罚, 于是浮到前面。fontconfig 没有
      「按 emoji-presentation 优先彩色字体」的概念, 只按覆盖顺序取第一个。

  修法: 在 scan 阶段把这 267 个「Color Emoji 也有」的码点从 Symbols 2 的
  charset 里减掉(压成 99 段), 回退走到 Symbols 2 时不命中 emoji, 继续落到
  Color Emoji; Symbols 2 独有的 991 个符号原样保留。
  改完必须 `fc-cache -f` 重建缓存, scan 规则才生效(否则静默无效)。

  码点集是 NotoSansSymbols2-Regular.ttf ∩ NotoColorEmoji.ttf(>=U+1F000)
  在本机算出的; 换字体版本可重算。验证: fc-match -s "Noto Sans:charset=1f6cf"
  头名应从 Noto Sans Symbols 2 变成 Noto Color Emoji。
-->
<fontconfig>
  <match target="scan">
    <test name="family" compare="eq">
      <string>Noto Sans Symbols 2</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <int>0x1F004</int>
          <int>0x1F0CF</int>
          <range><int>0x1F30D</int><int>0x1F30F</int></range>
          <int>0x1F315</int>
          <int>0x1F31C</int>
          <int>0x1F321</int>
          <range><int>0x1F324</int><int>0x1F32C</int></range>
          <int>0x1F336</int>
          <int>0x1F378</int>
          <int>0x1F37D</int>
          <int>0x1F393</int>
          <range><int>0x1F396</int><int>0x1F397</int></range>
          <range><int>0x1F399</int><int>0x1F39B</int></range>
          <range><int>0x1F39E</int><int>0x1F39F</int></range>
          <int>0x1F3A7</int>
