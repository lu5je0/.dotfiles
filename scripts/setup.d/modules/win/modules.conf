# WIN_HOME is auto-detected from DOTFILES_DIR parent.

[wezterm]
desc = link WezTerm config (Windows side junction)
script = wezterm.sh
check = $WIN_HOME/.config/wezterm

[gitconfig]
desc = link gitconfig (Windows side symlink)
script = gitconfig.sh
check = $WIN_HOME/.gitconfig

[wslconfig]
desc = link wslconfig (Windows side symlink)
script = wslconfig.sh
check = $WIN_HOME/.wslconfig

[neovide]
desc = link neovide config.toml (Windows side symlink)
script = neovide.sh
check = $WIN_HOME/AppData/Roaming/neovide/config.toml

[rime-ime]
desc = clone rime-ice (shallow) + link custom config (Weasel, ime/install.bat)
script = rime-ime.sh
check = $WIN_HOME/AppData/Roaming/Rime/cn_dicts

[nerd-font]
desc = install JetBrainsMonoNL Nerd Font Mono Medium (Windows user fonts)
script = nerd-font.sh
check_exists = $WIN_HOME/AppData/Local/Microsoft/Windows/Fonts/JetBrainsMonoNLNerdFontMono-Medium.ttf
