# Proton (Steam) 环境变量
# GNOME/Plasma 的会话由 systemd user manager 托管，会读 ~/.config/environment.d/*.conf，
# 从桌面启动的 Steam 因此能继承。只在会话启动时导入一次，改完必须重新登录。
# 语法上只支持 KEY=value 和 ${OTHER} 引用，不做 shell 展开。
#
# Steam 若换成 flatpak 则本文件失效（沙箱不继承会话环境），需改用：
#   flatpak override --user --env=PROTON_ENABLE_WAYLAND=1 com.valvesoftware.Steam
PROTON_ENABLE_WAYLAND=1
