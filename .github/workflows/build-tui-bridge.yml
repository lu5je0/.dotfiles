name: Release tui-bridge

on:
  push:
    tags:
      - 'tui-bridge-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-latest
            shell: 'msys2 {0}'
            suffix: '.exe'
          - target: macos-arm64
            runner: macos-15
            shell: bash
            suffix: ''
          - target: linux-x86_64
            runner: ubuntu-22.04
            shell: bash
            suffix: ''
          - target: linux-aarch64
            runner: ubuntu-22.04-arm
            shell: bash
            suffix: ''
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-bin libwayland-dev libdbus-1-dev libx11-dev
      - name: Check release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(cat module/tui-bridge/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REF_TYPE" == tag ]]; then
            test "$REF_NAME" = "tui-bridge-v$version"
          fi
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          cd module/tui-bridge
          ./build.sh "build/tui-bridge-$TARGET$SUFFIX"
      - name: Verify binary version
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          binary="module/tui-bridge/build/tui-bridge-$TARGET$SUFFIX"
          file "$binary"
          test "$("$binary" --version)" = "$(cat module/tui-bridge/VERSION)"
          "$binary" --help
      - uses: actions/upload-artifact@v4
        with:
          name: tui-bridge-${{ matrix.target }}
          path: module/tui-bridge/build/tui-bridge-${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/tui-bridge-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tui-bridge-*
          merge-multiple: true
          path: release
      - name: Create checksums
        working-directory: release
        run: |
          test -f tui-bridge-macos-arm64
          test -f tui-bridge-linux-x86_64
          test -f tui-bridge-linux-aarch64
          test -f tui-bridge-windows-x86_64.exe
          sha256sum tui-bridge-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --generate-notes
